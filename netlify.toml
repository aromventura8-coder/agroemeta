[build]
  publish = "."
  command = "echo no-build-step"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Mapea /api/chat (lo que llama el frontend) a la funciÃ³n server-side.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

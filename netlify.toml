# AGROEMETA AGI - ConfiguraciÃ³n de Netlify
# El sitio se publica desde la raÃ­z y expone la funciÃ³n /api/chat.
# La llave de Gemini se define como variable de entorno en Netlify:
#   Site configuration -> Environment variables -> GEMINI_API_KEY

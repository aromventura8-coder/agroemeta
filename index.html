<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROEMETA // Mayordomo Inteligente</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00d2ff">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="cinema-night">
  <div class="app-stage">
    <header class="app-header">
      <div class="header-brand">
        <span class="brand-crest">✦</span>
        <div class="brand-info">
          <h1 class="brand-name">AGROEMETA</h1>
          <span class="brand-desc">Mayordomo AGI // Agronomía & Mecánica</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="voiceMuteBtn" class="pill-btn active" title="Alternar voz del mayordomo">
          <span class="btn-icon">🔊</span>
          <span class="btn-text">VOZ</span>
        </button>
        <div id="agiStatusBtn" class="pill-btn active" title="Núcleo AGI en línea">
          <span class="btn-dot"></span>
          <span class="btn-text">ANTIGRAVITY AGI</span>
        </div>
      </div>
    </header>

    <div class="living-core-container">
      <div class="living-core-wrapper">
        <div class="living-orb" id="livingOrb" title="Núcleo cognitivo de AGROEMETA">
          <div class="orb-inner-light"></div>
          <div class="orb-specular"></div>
        </div>
      </div>
      <div class="orb-state-caption" id="orbStateText">En línea y listo para ayudarte</div>
    </div>

    <main class="conversation-container" id="chatFeed">
      <!-- Indicador de procesamiento -->
      <div id="thinkingIndicator" class="thinking-indicator" style="display:none;">
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
      </div>
      <div class="bubble-row bubble-agroemeta">
        <div class="avatar-tag">AGROEMETA</div>
        <div class="bubble-content">
          Agroemeta en línea. Contame qué necesitás resolver hoy: agronomía, maquinaria, suelos, cultivos o cualquier consulta técnica y educativa. Decime los datos y arrancamos.
        </div>
      </div>
    </main>

    <footer class="app-composer">
      <div class="composer-bar">
        <button id="micToggleBtn" class="composer-btn mic-btn" title="Hablar por micrófono">
          <span>🎙️</span>
        </button>
        <div class="composer-input-box">
          <input type="text" id="userInput" placeholder="Escriba su consulta o hable con el micrófono (Enter para enviar)..." autocomplete="off" autofocus>
        </div>
        <button id="sendBtn" class="composer-btn send-btn" title="Enviar (o presione Enter)">
          <span>▲</span>
        </button>
      </div>

      <div class="voice-controls">
        <button id="voicePauseBtn" class="voice-btn" title="Pausar voz"><span>⏸️</span></button>
        <button id="voiceResumeBtn" class="voice-btn" title="Reanudar voz"><span>▶️</span></button>
        <button id="voiceStopBtn" class="voice-btn" title="Detener voz"><span>⏹️</span></button>
        <select id="voiceSpeedSelect" class="speed-select" title="Velocidad de voz">
          <option value="0.7">Lento 0.7x</option>
          <option value="0.85">0.85x</option>
          <option value="1.0" selected>Normal 1.0x</option>
          <option value="1.15">1.15x</option>
          <option value="1.3">Rápido 1.3x</option>
        </select>
      </div>
    </footer>

    <!-- Subtítulos visuales -->
    <div id="subtitlesPanel" class="subtitles-panel">
      <div class="subtitle-text" id="subtitleText">...</div>
      <div class="subtitle-status" id="subtitleStatus">Listo</div>
    </div>

    <script src="agro_knowledge.js"></script>
    <script src="app.js"></script>
  </div>
</body>
</html>
